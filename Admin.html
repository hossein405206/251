<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت 251</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d1a;color:#f5f7ff;font-family:Tahoma,Arial,sans-serif;padding:20px}.wrap{max-width:1050px;margin:auto}h1{font-size:25px}.muted{color:#aab6ce;line-height:1.9}.box,.card{background:#111a2c;border:1px solid #ffffff20;border-radius:16px;padding:18px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #ffffff24;background:#080f1e;color:white}input{min-width:220px;flex:1}button{cursor:pointer;background:#7047e8;border:0;font-weight:bold}button.danger{background:#a72f4d}button.secondary{background:#25324a}.hide{display:none}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#18233a;border-radius:12px;padding:12px 16px}.stat b{font-size:22px;display:block;margin-top:5px}.item{border:1px solid #ffffff1b;background:#0d1424;border-radius:13px;padding:15px;margin:12px 0}.item h3{margin:4px 0 10px}.meta{color:#aab6ce;font-size:13px;line-height:2}.desc{white-space:pre-wrap;line-height:1.9;overflow-wrap:anywhere}.msg{padding:12px;border-radius:10px;margin-top:10px;background:#30233b;white-space:pre-wrap}.msg.err{background:#592936}.msg.ok{background:#164737}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
</style></head><body><main class="wrap"><div class="top"><div><h1>پنل مدیریت پروژه‌های ۲۵۱</h1><p class="muted">این صفحه خصوصی است؛ رمز مدیر را فقط در Script Properties تنظیم کن.</p></div><a href="?">بازگشت به وضعیت سرویس</a></div>
<section id="login" class="box"><h2>ورود مدیر</h2><div class="row"><input id="password" type="password" autocomplete="current-password" placeholder="رمز مدیریت"><button onclick="login()">ورود</button></div><div id="loginMsg" class="msg hide"></div></section>
<section id="dashboard" class="hide"><div class="row"><button onclick="loadProjects()">بروزرسانی فهرست</button><button class="secondary" onclick="logout()">خروج</button></div><div id="stats" class="stats"></div><div id="list"></div></section>
<script>
let adminPassword = "";
function message(id,text,type){const e=document.getElementById(id);e.textContent=text;e.className="msg "+(type||"");e.classList.remove("hide")}
function login(){const p=document.getElementById("password").value;if(!p){message("loginMsg","رمز را وارد کن.","err");return}google.script.run.withSuccessHandler(r=>{adminPassword=p;document.getElementById("login").classList.add("hide");document.getElementById("dashboard").classList.remove("hide");loadProjects()}).withFailureHandler(e=>message("loginMsg",e.message||"ورود ناموفق بود.","err")).adminLogin(p)}
function logout(){adminPassword="";document.getElementById("password").value="";document.getElementById("dashboard").classList.add("hide");document.getElementById("login").classList.remove("hide")}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function loadProjects(){document.getElementById("list").innerHTML='<p class="muted">در حال بارگذاری…</p>';google.script.run.withSuccessHandler(render).withFailureHandler(e=>{document.getElementById("list").textContent=e.message||"خطا"}).adminList(adminPassword)}
function render(items){const count={};items.forEach(x=>count[x.status]=(count[x.status]||0)+1);document.getElementById("stats").innerHTML='<div class="stat">کل درخواست‌ها<b>'+items.length+'</b></div>'+["جدید","در حال بررسی","تأییدشده","در حال انجام","تکمیل‌شده","ردشده"].map(s=>'<div class="stat">'+s+'<b>'+(count[s]||0)+'</b></div>').join("");if(!items.length){document.getElementById("list").innerHTML='<div class="box">هنوز درخواستی ثبت نشده.</div>';return}document.getElementById("list").innerHTML=items.map(x=>'<article class="item"><div class="top"><h3>'+esc(x.title)+'</h3><span class="meta">کد: '+esc(x.id)+' | '+esc(x.created)+'</span></div><div class="meta">نام: '+esc(x.name)+' | تماس: '+esc(x.contact)+' | دسته: '+esc(x.category)+' | بودجه: '+esc(x.budget||"ذکر نشده")+' | زمان: '+esc(x.deadline||"ذکر نشده")+'</div><p class="desc">'+esc(x.description)+'</p><div class="row"><select id="s-'+esc(x.id)+'">'+["جدید","در حال بررسی","تأییدشده","در حال انجام","تکمیل‌شده","ردشده"].map(s=>'<option '+(s===x.status?'selected':'')+'>'+s+'</option>').join("")+'</select><button onclick="changeStatus(\''+esc(x.id)+'\')">ذخیره وضعیت</button><a class="secondary" style="padding:11px;border-radius:9px" href="https://eitaa.com/" target="_blank" rel="noopener">بازکردن ایتا</a><button class="danger" onclick="removeProject(\''+esc(x.id)+'\')">حذف درخواست</button></div></article>').join("")}
function changeStatus(id){const status=document.getElementById("s-"+id).value;google.script.run.withSuccessHandler(()=>loadProjects()).withFailureHandler(e=>alert(e.message||"ذخیره نشد")).adminUpdateStatus(adminPassword,id,status)}
function removeProject(id){if(!confirm("این درخواست برای همیشه حذف شود؟"))return;google.script.run.withSuccessHandler(()=>loadProjects()).withFailureHandler(e=>alert(e.message||"حذف انجام نشد")).adminDelete(adminPassword,id)}
document.getElementById("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
</script></main></body></html>
